{
  "name": "Sure Finance",
  "version": "0.1.2",
  "slug": "sure_finance",
  "description": "Sure personal finance with supervised web and background workers",
  "url": "https://github.com/alexcode9/sure-homeassistant",
  "arch": [
    "aarch64",
    "amd64"
  ],
  "stage": "experimental",
  "init": false,
  "boot": "manual",
  "timeout": 90,
  "backup": "cold",
  "ports": {
    "3000/tcp": 1235
  },
  "webui": "http://[HOST]:[PORT:3000]",
  "image": "ghcr.io/alexcode9/sure-homeassistant",
  "options": {
    "db_host": "",
    "db_port": 5432,
    "postgres_user": "sure_user",
    "postgres_db": "sure_production",
    "postgres_password": "",
    "redis_url": "",
    "app_domain": "",
    "https_proxy": false,
    "rails_max_threads": 3,
    "rails_ai_max_threads": 1,
    "dependency_timeout": 180
  },
  "schema": {
    "db_host": "str",
    "db_port": "port",
    "postgres_user": "str",
    "postgres_db": "str",
    "postgres_password": "password",
    "redis_url": "password",
    "app_domain": "str",
    "https_proxy": "bool",
    "rails_max_threads": "int(2,16)",
    "rails_ai_max_threads": "int(1,8)",
    "dependency_timeout": "int(30,600)",
    "secret_key_base": "password?",
    "active_record_encryption_primary_key": "password?",
    "active_record_encryption_deterministic_key": "password?",
    "active_record_encryption_key_derivation_salt": "password?",
    "smtp_password": "password?",
    "openai_access_token": "password?",
    "smtp_address": "str?",
    "smtp_username": "str?",
    "email_sender": "str?",
    "openai_model": "str?",
    "openai_uri_base": "str?",
    "smtp_port": "port?",
    "smtp_tls_enabled": "bool?"
  }
}
