name: Check official Sure releases
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: python3 scripts/check_upstream.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
