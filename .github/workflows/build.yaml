name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/validate.py
      - run: ruby tests/runtime_test.rb
      - run: bash -n tests/smoke.sh
      - run: shellcheck tests/smoke.sh
      - name: Validate HA metadata
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809
        with:
          path: ./sure
  build:
    needs: validate
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build native image
        run: docker build --pull -t sure-test sure
      - name: Isolated PostgreSQL 17 and Redis integration tests
        run: tests/smoke.sh sure-test
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidate
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/alexcode9/sure-homeassistant
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag sure-test "$IMAGE:sha-$SHA-$ARCH"
          docker push "$IMAGE:sha-$SHA-$ARCH"
  manifest:
    if: github.event_name != 'pull_request'
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble only tested architectures
        env:
          IMAGE: ghcr.io/alexcode9/sure-homeassistant
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          tag="sha-$SHA"
          if [[ "$REF" == refs/tags/v* ]]; then
            version=$(python3 -c 'import json; print(json.load(open("sure/config.yaml"))["version"])')
            test "$REF" = "refs/tags/v$version"
            tag="$version"
            if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo 'Version already published. Never overwrite release tags.' >&2
              exit 1
            fi
          fi
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:sha-$SHA-amd64" "$IMAGE:sha-$SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag"
